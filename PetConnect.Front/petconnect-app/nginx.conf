# ================================================================
# PETCONNECT Web — configuracion de nginx (item 5.2 de la auditoria, A-30)
#
# El Dockerfile copia este archivo a /etc/nginx/conf.d/default.conf.
# Hace dos cosas:
#   1. Sirve la web compilada (dist/) y manda las rutas de React a index.html.
#   2. Pasa todo lo que empiece por /api/ a la API (el servicio "api" del
#      docker-compose.yml, puerto 5000). Hace lo mismo que el proxy de Vite
#      en desarrollo, que en produccion no existe.
# La prueba tests/docker.test.js revisa este archivo.
# ================================================================

server {
    listen 80;
    server_name _;

    # No mostrar la version de nginx en errores ni encabezados: es una pista
    # menos para quien busque fallos conocidos de esa version.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- API ----------
    # "api" es el nombre del servicio en docker-compose.yml (parte 3 del 5.2).
    # Sin barra al final del proxy_pass: la ruta llega completa
    # (/api/mascotas -> http://api:5000/api/mascotas).
    location /api/ {
        proxy_pass http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        # Agrega al final la IP real de quien hizo la peticion. La API, con
        # PROXY_CONFIABLE=1, cuenta el limite de intentos por esa ULTIMA IP
        # (la que pone nginx, que el usuario no puede falsificar). Sin esto,
        # todos contarian como la IP de nginx y el limite bloquearia a todos.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Los formularios de la web son pequenos: 1 MB sobra
        client_max_body_size 1m;
    }

    # ---------- Web (React) ----------
    # Si el archivo existe (JS, CSS, imagenes) se entrega; si no, se entrega
    # index.html y React Router muestra la pagina. Asi /adopcion o /catalogo
    # funcionan al recargar o al abrirlas desde un enlace, en vez de dar 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
